<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login / Sign Up — Qalb-e-Deen</title>

  <meta name="description" content="Login or create your account on Qalb-e-Deen — The Heart of Deen.">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --green:#0b594a;
      --green2:#08715d;
      --deep:#073b32;
      --gold:#d8b45a;
      --gold2:#edcf78;
      --cream:#f8f6ef;
      --white:#ffffff;
      --text:#18352f;
      --muted:#71827d;
      --line:#dfe7e2;
      --danger:#c0392b;
      --success:#16805b;
    }

    body{
      min-height:100vh;
      font-family:Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(216,180,90,.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(11,89,74,.16), transparent 35%),
        var(--cream);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:25px;
    }

    .page{
      width:100%;
      max-width:1050px;
      min-height:650px;
      background:var(--white);
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 25px 70px rgba(7,59,50,.15);
      display:grid;
      grid-template-columns:42% 58%;
    }

    /* LEFT */

    .brand-panel{
      background:
        linear-gradient(145deg, rgba(7,59,50,.97), rgba(11,89,74,.96)),
        url("https://images.unsplash.com/photo-1609599006353-e629aaabfeae?auto=format&fit=crop&w=1000&q=80");
      background-size:cover;
      background-position:center;
      color:white;
      padding:55px 42px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }

    .brand-panel:before{
      content:"";
      position:absolute;
      width:280px;
      height:280px;
      border:1px solid rgba(237,207,120,.28);
      border-radius:50%;
      top:-100px;
      left:-100px;
    }

    .brand-panel:after{
      content:"";
      position:absolute;
      width:360px;
      height:360px;
      border:1px solid rgba(237,207,120,.15);
      border-radius:50%;
      bottom:-170px;
      right:-170px;
    }

    .brand-content{
      position:relative;
      z-index:2;
    }

    .logo{
      width:78px;
      height:78px;
      border-radius:50%;
      border:2px solid var(--gold2);
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:25px;
      font-size:35px;
      background:rgba(255,255,255,.07);
    }

    .brand-panel h1{
      font-family:Georgia,serif;
      font-size:42px;
      margin-bottom:8px;
      letter-spacing:.3px;
    }

    .tagline{
      color:var(--gold2);
      font-size:14px;
      letter-spacing:2px;
      text-transform:uppercase;
      margin-bottom:25px;
    }

    .brand-panel p{
      color:rgba(255,255,255,.82);
      line-height:1.8;
      font-size:15px;
      max-width:370px;
    }

    .verse{
      margin-top:35px;
      padding:18px;
      border-left:3px solid var(--gold2);
      background:rgba(255,255,255,.06);
      border-radius:0 12px 12px 0;
      color:#f8f5e9;
      font-family:Georgia,serif;
      line-height:1.7;
      font-size:14px;
    }

    /* RIGHT */

    .form-panel{
      padding:45px 55px;
      display:flex;
      align-items:center;
    }

    .form-container{
      width:100%;
      max-width:450px;
      margin:auto;
    }

    .top{
      margin-bottom:25px;
    }

    .top h2{
      font-family:Georgia,serif;
      color:var(--deep);
      font-size:32px;
      margin-bottom:8px;
    }

    .top p{
      color:var(--muted);
      font-size:14px;
    }

    .tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      background:#eef3f0;
      border-radius:12px;
      padding:4px;
      margin-bottom:25px;
    }

    .tab{
      border:0;
      padding:12px;
      background:transparent;
      border-radius:9px;
      cursor:pointer;
      font-weight:700;
      color:var(--muted);
      transition:.2s;
    }

    .tab.active{
      background:white;
      color:var(--green);
      box-shadow:0 4px 12px rgba(0,0,0,.07);
    }

    .form{
      display:none;
    }

    .form.active{
      display:block;
    }

    .field{
      margin-bottom:17px;
    }

    .field label{
      display:block;
      font-size:13px;
      font-weight:700;
      color:var(--deep);
      margin-bottom:7px;
    }

    .field input{
      width:100%;
      border:1px solid var(--line);
      border-radius:10px;
      padding:13px 14px;
      font-size:14px;
      outline:none;
      background:#fbfcfb;
      transition:.2s;
    }

    .field input:focus{
      border-color:var(--green2);
      box-shadow:0 0 0 3px rgba(8,113,93,.09);
      background:white;
    }

    .password-box{
      position:relative;
    }

    .password-box input{
      padding-right:50px;
    }

    .show-password{
      position:absolute;
      right:13px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:none;
      cursor:pointer;
      font-size:17px;
    }

    .photo-box{
      display:flex;
      align-items:center;
      gap:15px;
      padding:12px;
      border:1px dashed #cbd9d3;
      border-radius:12px;
      margin-bottom:18px;
      background:#fafcfb;
    }

    .photo-preview{
      width:58px;
      height:58px;
      border-radius:50%;
      background:#e5f0eb;
      border:2px solid var(--gold2);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:23px;
      flex-shrink:0;
    }

    .photo-preview img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .photo-info{
      flex:1;
    }

    .photo-info strong{
      display:block;
      color:var(--deep);
      font-size:13px;
      margin-bottom:4px;
    }

    .photo-info span{
      color:var(--muted);
      font-size:11px;
    }

    .photo-info input{
      margin-top:7px;
      width:100%;
      font-size:11px;
    }

    .forgot{
      text-align:right;
      margin-top:-7px;
      margin-bottom:18px;
    }

    .forgot button{
      border:0;
      background:none;
      color:var(--green2);
      cursor:pointer;
      font-size:12px;
      font-weight:700;
    }

    .main-btn{
      width:100%;
      padding:14px;
      border:0;
      border-radius:11px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:white;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      transition:.2s;
      box-shadow:0 8px 18px rgba(11,89,74,.18);
    }

    .main-btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 22px rgba(11,89,74,.25);
    }

    .main-btn:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
    }

    .message{
      min-height:20px;
      margin:13px 0;
      font-size:12px;
      text-align:center;
      line-height:1.5;
    }

    .message.error{
      color:var(--danger);
    }

    .message.success{
      color:var(--success);
    }

    .divider{
      display:flex;
      align-items:center;
      gap:10px;
      margin:23px 0;
      color:#9aa8a3;
      font-size:11px;
    }

    .divider:before,
    .divider:after{
      content:"";
      flex:1;
      height:1px;
      background:var(--line);
    }

    .home-btn{
      display:block;
      width:100%;
      text-align:center;
      padding:12px;
      border:1px solid var(--line);
      border-radius:10px;
      color:var(--green);
      text-decoration:none;
      font-size:13px;
      font-weight:700;
    }

    .home-btn:hover{
      background:#f5f8f6;
    }

    .footer-note{
      text-align:center;
      color:#9aa8a3;
      font-size:10px;
      margin-top:18px;
    }

    /* MODAL */

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:9999;
    }

    .modal.show{
      display:flex;
    }

    .modal-card{
      width:100%;
      max-width:390px;
      background:white;
      border-radius:18px;
      padding:25px;
      box-shadow:0 25px 70px rgba(0,0,0,.25);
    }

    .modal-card h3{
      color:var(--deep);
      font-family:Georgia,serif;
      margin-bottom:8px;
    }

    .modal-card p{
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
      margin-bottom:18px;
    }

    .modal-actions{
      display:flex;
      gap:10px;
    }

    .modal-actions button{
      flex:1;
      padding:11px;
      border-radius:9px;
      cursor:pointer;
      font-weight:700;
    }

    .cancel-btn{
      background:#f0f3f1;
      border:0;
    }

    .reset-btn{
      background:var(--green);
      color:white;
      border:0;
    }

    /* MOBILE */

    @media(max-width:800px){

      body{
        padding:12px;
      }

      .page{
        grid-template-columns:1fr;
        min-height:auto;
        border-radius:20px;
      }

      .brand-panel{
        padding:35px 28px;
        min-height:330px;
      }

      .brand-panel h1{
        font-size:34px;
      }

      .verse{
        margin-top:22px;
      }

      .form-panel{
        padding:35px 25px;
      }
    }

    @media(max-width:430px){

      .brand-panel{
        min-height:290px;
      }

      .brand-panel p{
        font-size:13px;
      }

      .verse
